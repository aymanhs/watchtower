name: disk
description: Filesystem usage, per real mounted volume
groups:
  - basic
  - linux
tags:
  - system
  - resource
interval: 60s
timeout: 5s
collector:
  type: shell
  # No config: every real mounted filesystem is discovered each cycle —
  # no per-server path to set. Each measurement key is instance-prefixed
  # with its mount point, sanitized so "/" (which internal/storage and
  # this engine's own "server/metric.measurement" naming both use as a
  # separator) can't collide with it: "/" -> "root", "/data" -> "data",
  # "/var/log" -> "var_log" (leading slash stripped, the rest "_"-joined).
  # One declared "total"/"used"/"free"/"used_percent" below applies to
  # however many volumes a host actually has — see
  # metric.Definition.ResolveMeasurement for how a measurement like
  # "root_used" resolves against the single declared "used".
  command: |
    df -B1 --output=target,size,used,avail,fstype >/dev/null 2>&1 || exit 1
    df -B1 --output=target,size,used,avail,fstype 2>/dev/null | awk '
      NR == 1 { next }
      $5 ~ /^(tmpfs|devtmpfs|efivarfs|proc|sysfs|cgroup|cgroup2|overlay|squashfs|debugfs|tracefs|mqueue|hugetlbfs|rpc_pipefs|binfmt_misc|autofs|devpts|pstore|securityfs|configfs|fusectl|bpf)$/ { next }
      {
        mount = $1
        if (mount == "/") {
          name = "root"
        } else {
          name = mount
          sub(/^\//, "", name)
          gsub(/\//, "_", name)
        }
        size = $2; used = $3; avail = $4
        print name "_total=" size
        print name "_used=" used
        print name "_free=" avail
        if (size > 0) print name "_used_percent=" (used / size * 100)
      }'
metrics:
  total:
    unit: bytes
    type: gauge
  used:
    unit: bytes
    type: gauge
    display:
      widget: bar
      label: Used
      scale:
        max_ref: total
  free:
    unit: bytes
    type: gauge
    display:
      widget: bar
      label: Free
      scale:
        max_ref: total
  used_percent:
    unit: percent
    type: gauge
    display:
      # Plain bar, not the single headline gauge disk.yaml used to have:
      # there's no one "primary" volume once a host can have several —
      # every volume gets the same even treatment.
      widget: bar
      label: Used %
      scale:
        min: 0
        max: 100
events:
  - name: disk.used_percent.warning
    measurement: used_percent
    condition: above
    threshold: 80
    severity: warning
  - name: disk.used_percent.critical
    measurement: used_percent
    condition: above
    threshold: 90
    severity: critical
    recover_below: 85
