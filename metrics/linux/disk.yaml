name: disk
description: Filesystem usage, per real mounted volume
groups:
  - basic
  - linux
tags:
  - system
  - resource
interval: 60s
timeout: 5s
collector:
  type: shell
  # No config: every real mounted filesystem is discovered each cycle —
  # no per-server path to set. Each measurement key is instance-qualified
  # with its mount point as a leading dot-segment: "root.used_percent",
  # "data.used_percent" — metric.SplitInstance splits on the *last* "."
  # to pull the mount point out of "used_percent" against however many
  # volumes a host actually has, so the mount-point segment itself
  # is sanitized to never contain a "." (nor "/", which this engine's own
  # "server/metric.measurement" naming also uses as a separator):
  # "/" -> "root", "/data" -> "data", "/var/log" -> "var_log" (leading
  # slash stripped, the rest "_"-joined, any literal "." also "_"-joined
  # — e.g. a hypothetical "/mnt/v1.2" -> "mnt_v1_2").
  command: |
    df -B1 --output=target,size,used,avail,fstype >/dev/null 2>&1 || exit 1
    df -B1 --output=target,size,used,avail,fstype 2>/dev/null | awk '
      NR == 1 { next }
      $5 ~ /^(tmpfs|devtmpfs|efivarfs|proc|sysfs|cgroup|cgroup2|overlay|squashfs|debugfs|tracefs|mqueue|hugetlbfs|rpc_pipefs|binfmt_misc|autofs|devpts|pstore|securityfs|configfs|fusectl|bpf)$/ { next }
      {
        mount = $1
        if (mount == "/") {
          name = "root"
        } else {
          name = mount
          sub(/^\//, "", name)
          gsub(/\//, "_", name)
          gsub(/\./, "_", name)
        }
        size = $2; used = $3; avail = $4
        print name ".total=" size
        print name ".used=" used
        print name ".free=" avail
        if (size > 0) print name ".used_percent=" (used / size * 100)
      }'
events:
  - name: disk.used_percent.warning
    measurement: used_percent
    condition: above
    threshold: 80
    severity: warning
  - name: disk.used_percent.critical
    measurement: used_percent
    condition: above
    threshold: 90
    severity: critical
    recover_below: 85
