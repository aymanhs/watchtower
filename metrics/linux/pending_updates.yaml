name: pending_updates
kind: object
groups:
  - linux
interval: 30m
timeout: 30s
collector:
  type: shell
  command: |
    command -v apt >/dev/null 2>&1 || { echo '[]'; exit 0; }
    apt list --upgradable 2>/dev/null | tail -n +2 | head -n 40 | awk -F'[/ ]' '
      BEGIN { printf "[" }
      { printf "%s{\"package\":\"%s\",\"version\":\"%s\",\"security\":%s}", (NR>1 ? "," : ""), $1, $3, ($2 ~ /-security/ ? "true" : "false") }
      END { print "]" }'
emit:
  total: count
  security: count where security = true
events:
  - name: pending_updates.security
    measurement: security
    condition: above
    threshold: 0
    severity: warning
