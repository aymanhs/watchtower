name: memory
description: System memory statistics
groups:
  - basic
  - linux
tags:
  - system
  - resource
interval: 10s
timeout: 5s
collector:
  type: shell
  command: |
    free -b | awk '
      /Mem:/ {
        print "total=" $2
        print "used=" $3
        print "free=" $4
        print "shared=" $5
        print "cache=" $6
        print "available=" $7
        print "used_percent=" ($3/$2*100)
      }'
metrics:
  total:
    unit: bytes
    type: gauge
    # No display block: this is the reference other measurements scale
    # against (display.scale.max_ref below), not something to show its
    # own bar for. Stays plain text.
  used:
    unit: bytes
    type: gauge
    display:
      widget: bar
      scale:
        max_ref: total
  free:
    unit: bytes
    type: gauge
    display:
      widget: bar
      scale:
        max_ref: total
  cache:
    unit: bytes
    type: gauge
    display:
      widget: bar
      scale:
        max_ref: total
  available:
    unit: bytes
    type: gauge
    display:
      widget: bar
      scale:
        max_ref: total
  used_percent:
    unit: percent
    type: gauge
    display:
      widget: gauge
      primary: true
      scale:
        min: 0
        max: 100
events:
  - name: memory.available.warning
    measurement: available
    condition: below
    threshold: 536870912
    severity: warning
  - name: memory.available.critical
    measurement: available
    condition: below
    threshold: 134217728
    severity: critical
    recover_above: 268435456
  - name: memory.used_percent.warning
    measurement: used_percent
    condition: above
    threshold: 80
    severity: warning
  - name: memory.used_percent.critical
    measurement: used_percent
    condition: above
    threshold: 90
    severity: critical
    recover_below: 85
