name: nats
description: NATS server statistics, via its HTTP monitoring endpoint (varz)
groups:
  - messaging
tags:
  - messaging
  - nats
interval: 15s
timeout: 5s
collector:
  # Native Go: fetched and JSON-decoded in-process, no curl/jq on the
  # target at all — works identically on Windows and POSIX, local or (for
  # an ssh-type server) tunneled through the existing SSH session so a
  # loopback-bound endpoint like this one is reached exactly as if running
  # on that host. No "fields:" needed below — every measurement key here
  # already matches its JSON field name in varz.
  type: http
  url: "http://{{.endpoint}}/varz"
metrics:
  connections:
    unit: count
    type: gauge
    display:
      label: Connections
  in_msgs:
    unit: count
    type: counter
    display:
      label: In Messages
  out_msgs:
    unit: count
    type: counter
    display:
      label: Out Messages
  in_bytes:
    unit: bytes
    type: counter
    display:
      label: In
  out_bytes:
    unit: bytes
    type: counter
    display:
      label: Out
  slow_consumers:
    unit: count
    type: gauge
    display:
      label: Slow Consumers
  mem:
    unit: bytes
    type: gauge
    display:
      label: Memory
  cpu:
    unit: percent
    type: gauge
    display:
      widget: gauge
      primary: true
      label: CPU
      scale:
        min: 0
        max: 100
events:
  - name: nats.slow_consumers.warning
    measurement: slow_consumers
    condition: above
    threshold: 0
    severity: warning
  - name: nats.cpu.warning
    measurement: cpu
    condition: above
    threshold: 80
    severity: warning
  - name: nats.cpu.critical
    measurement: cpu
    condition: above
    threshold: 90
    severity: critical
    recover_below: 85
